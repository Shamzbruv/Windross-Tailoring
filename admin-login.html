<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Windross Tailoring</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #050505;
            --panel: rgba(18, 18, 18, 0.75);
            --input: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #F5F5F7;
            --muted: #86868B;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 80%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: white;
            margin-bottom: 5px;
            margin-top: 0;
        }

        .login-card p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--gold);
        }

        button {
            width: 100%;
            background: var(--gold);
            color: black;
            border: none;
            padding: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background: #e6c86a;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            color: #aaa;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Windross Admin</h1>
        <p>Please log in to continue.</p>

        <form id="login-form">
            <input type="email" id="email" placeholder="Admin Email Address" required autofocus />
            <div class="error-msg" id="error-msg"></div>
            <div style="color:var(--gold); font-size:0.85rem; margin-top:-10px; margin-bottom:15px; display:none;" id="success-msg">Check your email for the login link!</div>
            <button type="submit" id="submit-btn">Send Login Link</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "windross-tailoring.firebaseapp.com",
            projectId: "windross-tailoring",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const btn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        // Check if returning from email link
        if (isSignInWithEmailLink(auth, window.location.href)) {
            let email = window.localStorage.getItem('emailForSignIn');
            if (!email) {
                email = window.prompt('Please provide your email for confirmation');
            }
            
            if (email) {
                emailInput.value = email;
                btn.disabled = true;
                btn.textContent = 'Verifying link...';
                
                signInWithEmailLink(auth, email, window.location.href)
                    .then(async (result) => {
                        window.localStorage.removeItem('emailForSignIn');
                        
                        // Get ID token to send to our backend
                        const idToken = await result.user.getIdToken();
                        
                        // Send to our backend to establish session cookie
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idToken })
                        });
                        const data = await res.json();
                        
                        if (res.ok && data.success) {
                            window.location.href = '/admin-availability.html';
                        } else {
                            throw new Error(data.error || 'Backend verification failed.');
                        }
                    })
                    .catch((error) => {
                        console.error(error);
                        errorMsg.textContent = error.message || 'Error signing in. The link may have expired.';
                        errorMsg.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = 'Send Login Link';
                    });
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();

            btn.disabled = true;
            btn.textContent = 'Sending...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const actionCodeSettings = {
                // Must be the full URL of this exact page
                url: window.location.origin + '/admin-login.html',
                handleCodeInApp: true
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                window.localStorage.setItem('emailForSignIn', email);
                successMsg.style.display = 'block';
                btn.textContent = 'Link Sent!';
            } catch (err) {
                console.error(err);
                errorMsg.textContent = err.message || 'Failed to send login link. Check configuration.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Send Login Link';
            }
        });
    </script>
</body>
</html>
