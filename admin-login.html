<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Windross Tailoring</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #050505;
            --panel: rgba(18, 18, 18, 0.75);
            --input: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #F5F5F7;
            --muted: #86868B;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 80%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: white;
            margin-bottom: 5px;
            margin-top: 0;
        }

        .login-card p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--gold);
        }

        button {
            width: 100%;
            background: var(--gold);
            color: black;
            border: none;
            padding: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background: #e6c86a;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            color: #aaa;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Windross Admin</h1>
        <p>Please log in to continue.</p>

        <form id="login-form">
            <input type="email" id="email" placeholder="Admin Email Address" required autofocus />
            <input type="password" id="password" placeholder="Password" required />
            <label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.9rem; margin-bottom: 20px; cursor:pointer;">
                <input type="checkbox" id="remember-me" style="width:16px; height:16px; margin:0; accent-color:var(--gold);" checked />
                Remember my login
            </label>
            <div class="error-msg" id="error-msg"></div>
            <button type="submit" id="submit-btn">Login</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember-me');
        const btn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = rememberCheckbox.checked;

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    window.location.href = '/admin-availability.html';
                } else {
                    throw new Error(data.error || 'Invalid credentials');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = err.message || 'Failed to login.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
