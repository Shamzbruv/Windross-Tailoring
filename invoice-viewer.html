<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice — Windross Tailoring & Design</title>
    <meta name="description" content="View your Windross Tailoring invoice details and download your invoice PDF.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0c0c0e;
            --card-bg: #141418;
            --card-border: rgba(216, 196, 141, 0.12);
            --info-bg: rgba(255, 255, 255, 0.03);
            --info-border: rgba(216, 196, 141, 0.08);
            --gold: #D8C48D;
            --gold-dim: rgba(216, 196, 141, 0.6);
            --white: #f5f2eb;
            --muted: #8a8880;
            --green: #4ade80;
            --amber: #fbbf24;
            --divider: rgba(255, 255, 255, 0.06);
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 60px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .invoice-card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
        }

        /* ─── Top Header (matches PDF) ─── */
        .inv-top-header {
            padding: 28px 28px 22px;
            border-bottom: 2px solid var(--gold);
        }

        .inv-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .inv-brand-name {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.3px;
        }

        .inv-brand-tagline {
            font-size: 0.76rem;
            color: var(--muted);
            margin-top: 3px;
        }

        .inv-title-right { text-align: right; }

        .inv-title-label {
            font-family: var(--font-heading);
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 6px;
        }

        .inv-title-meta {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.7;
        }

        /* ─── FROM / BILL TO cards ─── */
        .inv-info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 20px 28px;
            border-bottom: 1px solid var(--divider);
        }

        .inv-info-card {
            background: var(--info-bg);
            border: 1px solid var(--info-border);
            border-radius: 10px;
            padding: 16px 18px;
        }

        .inv-info-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .inv-info-text {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.65;
            white-space: pre-line;
        }

        .inv-info-text strong {
            color: var(--white);
            font-weight: 600;
        }

        /* ─── Line Items Table ─── */
        .inv-items-section {
            padding: 20px 28px;
            border-bottom: 1px solid var(--divider);
        }

        .items-table { width: 100%; border-collapse: collapse; }

        .items-table thead tr {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }

        .items-table th {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--white);
            text-align: left;
            padding: 10px 12px;
        }

        .items-table th:nth-child(2) { text-align: center; width: 50px; }
        .items-table th:nth-child(3),
        .items-table th:nth-child(4) { text-align: right; }

        .items-table td {
            font-size: 0.84rem;
            padding: 13px 12px;
            border-bottom: 1px solid var(--divider);
            vertical-align: top;
        }

        .items-table tr:last-child td { border-bottom: none; }
        .items-table td:nth-child(2) { text-align: center; color: var(--muted); }
        .items-table td:nth-child(3) { text-align: right; color: var(--muted); white-space: nowrap; }
        .items-table td:nth-child(4) { text-align: right; font-weight: 600; white-space: nowrap; }

        .item-desc { font-weight: 600; color: var(--white); }

        /* ─── Payment + Totals side-by-side (matches PDF) ─── */
        .inv-summary-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 20px 28px;
            border-bottom: 1px solid var(--divider);
        }

        .inv-payment-card,
        .inv-totals-card {
            background: var(--info-bg);
            border: 1px solid var(--info-border);
            border-radius: 10px;
            padding: 16px 18px;
        }

        .inv-section-title {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .payment-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 0.82rem;
        }

        .payment-label { color: var(--muted); font-weight: 500; }
        .payment-value { color: var(--white); font-weight: 600; text-align: right; }
        .payment-value.gold { color: var(--gold); }
        .payment-value.green { color: var(--green); }
        .payment-value.amber { color: var(--amber); }

        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 0.84rem;
        }

        .totals-label { color: var(--muted); font-weight: 600; }
        .totals-value { color: var(--white); font-weight: 600; text-align: right; }

        .totals-divider { border: none; border-top: 1px solid var(--divider); margin: 8px 0; }

        .total-final { padding: 6px 0 2px; }
        .total-final .totals-label {
            font-family: var(--font-heading);
            font-size: 1rem;
            color: var(--white);
            font-weight: 700;
        }
        .total-final .totals-value {
            font-family: var(--font-heading);
            font-size: 1.08rem;
            color: var(--gold);
            font-weight: 700;
        }

        /* ─── Balance Outstanding banner ─── */
        .inv-balance-banner {
            padding: 16px 28px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
        }

        .balance-amount {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* ─── Notes ─── */
        .inv-notes-section {
            padding: 18px 28px;
            border-bottom: 1px solid var(--divider);
        }

        .notes-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gold-dim);
            margin-bottom: 8px;
        }

        .notes-text {
            font-size: 0.84rem;
            color: var(--muted);
            line-height: 1.65;
            white-space: pre-line;
        }

        /* ─── Exchange Policy ─── */
        .inv-policy-banner {
            padding: 18px 28px;
            background: rgba(216, 196, 141, 0.035);
            border-bottom: 1px solid var(--divider);
        }

        .policy-title {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .policy-text {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 3px;
        }

        .policy-sub { font-size: 0.76rem; color: var(--muted); }

        /* ─── Actions ─── */
        .inv-actions { padding: 24px 28px; }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #D8C48D 0%, #B89C5A 100%);
            color: #111;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(216, 196, 141, 0.25);
        }

        .download-btn:active { transform: translateY(0); }
        .download-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .contact-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .contact-link a {
            color: var(--gold-dim);
            text-decoration: none;
        }

        .contact-link a:hover { color: var(--gold); text-decoration: underline; }

        /* ─── Footer ─── */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.76rem;
            color: var(--muted);
            max-width: 460px;
            line-height: 1.6;
        }

        .footer-text a { color: var(--gold-dim); text-decoration: none; }

        /* ─── Loading & Error ─── */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            gap: 16px;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid var(--divider);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 0.86rem; color: var(--muted); }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            padding: 40px 28px;
            text-align: center;
            gap: 10px;
        }

        .error-icon { font-size: 2.4rem; opacity: 0.7; }

        .error-title {
            font-family: var(--font-heading);
            font-size: 1.12rem;
            color: var(--white);
        }

        .error-message { font-size: 0.84rem; color: var(--muted); max-width: 360px; }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 10px 20px;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.3);
            border-radius: 8px;
            color: #25D366;
            font-size: 0.84rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .whatsapp-btn:hover { background: rgba(37, 211, 102, 0.18); }
        .whatsapp-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        /* ─── Responsive ─── */
        @media (max-width: 560px) {
            body { padding: 16px 10px 40px; }

            .inv-top-header, .inv-info-row, .inv-items-section,
            .inv-summary-row, .inv-notes-section, .inv-policy-banner,
            .inv-actions, .inv-balance-banner { padding-left: 18px; padding-right: 18px; }

            .inv-top-row { flex-direction: column; gap: 12px; }
            .inv-title-right { text-align: left; }

            .inv-info-row { grid-template-columns: 1fr; }
            .inv-summary-row { grid-template-columns: 1fr; }

            .inv-brand-name { font-size: 1.3rem; }
            .inv-title-label { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <div class="invoice-card" id="invoice-card">
        <!-- Loading -->
        <div id="loading-state">
            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text">Loading your invoice…</div>
            </div>
        </div>

        <!-- Error (hidden) -->
        <div id="error-state" style="display:none"></div>

        <!-- Invoice Content (hidden) -->
        <div id="invoice-content" style="display:none"></div>
    </div>

    <div class="footer-text" id="footer" style="display:none">
        Thank you for choosing Windross Tailoring.<br>
        Please reply to this invoice or <a href="https://wa.me/18765986434" target="_blank" rel="noopener">contact us on WhatsApp</a> if you need anything adjusted.
    </div>

    <noscript>
        <div style="text-align:center;padding:40px 20px;color:#8a8880;font-family:sans-serif;">
            <p style="color:#D8C48D;font-size:1.1rem;margin-bottom:12px;">JavaScript is required</p>
            <p>Please enable JavaScript to view your invoice, or contact Windross on
                <a href="https://wa.me/18765986434" style="color:#25D366;">WhatsApp</a>.</p>
        </div>
    </noscript>

    <script>
        /* ─── Utilities ─── */
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        function fmtCurrency(amount, currency) {
            const num = Number(amount || 0);
            const sym = { JMD: 'J$ ', USD: 'US$ ', GBP: '£' };
            return `${sym[currency] || currency + ' '}${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function fmtDate(dateStr) {
            if (!dateStr) return '—';
            const p = String(dateStr).split('-');
            if (p.length < 3) return String(dateStr);
            const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
        }

        function fmtPercent(val) {
            return `${Number(val || 0).toFixed(2)}%`;
        }

        /* ─── Error ─── */
        function showError(title, msg) {
            document.getElementById('loading-state').style.display = 'none';
            const el = document.getElementById('error-state');
            el.style.display = 'block';
            el.innerHTML = `
                <div class="error-container">
                    <div class="error-icon">📄</div>
                    <div class="error-title">${esc(title)}</div>
                    <div class="error-message">${esc(msg)}</div>
                    <a href="https://wa.me/18765986434?text=${encodeURIComponent('Hello Windross, I am having trouble viewing my invoice.')}"
                       class="whatsapp-btn" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7
                                     8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8
                                     8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                        </svg>
                        Contact Windross
                    </a>
                </div>
            `;
        }

        /* ─── Render (mirrors the PDF layout) ─── */
        function renderInvoice(inv) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('footer').style.display = 'block';

            const el = document.getElementById('invoice-content');
            el.style.display = 'block';

            const hasDeposit = Number(inv.depositPercentage) > 0;
            const hasTax = Number(inv.taxAmount) > 0;
            const statusClass = inv.paymentStatus === 'paid' ? 'green' : inv.paymentStatus === 'partial' ? 'amber' : '';

            let html = '';

            /* ── Top Header ── */
            html += `
                <div class="inv-top-header">
                    <div class="inv-top-row">
                        <div>
                            <div class="inv-brand-name">Windross Tailoring</div>
                            <div class="inv-brand-tagline">Designer suits, shirts, ladies suits, vests and more.</div>
                        </div>
                        <div class="inv-title-right">
                            <div class="inv-title-label">Invoice</div>
                            <div class="inv-title-meta">
                                Invoice #: ${esc(inv.invoiceNumber)}<br>
                                Issue Date: ${fmtDate(inv.issueDate)}<br>
                                ${inv.dueDate ? `Due Date: ${fmtDate(inv.dueDate)}` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            /* ── FROM / BILL TO ── */
            const billToLines = [
                inv.customerName || 'Valued Client',
                inv.customerEmail || '—',
                inv.customerPhone || '—',
                inv.customerAddress || '—'
            ].join('\n');

            html += `
                <div class="inv-info-row">
                    <div class="inv-info-card">
                        <div class="inv-info-label">From</div>
                        <div class="inv-info-text"><strong>Windross Tailoring & Design</strong>
68 Hagley Park Road (Mancare Plaza)
Kingston 10, Jamaica
Phone / WhatsApp: (876) 598-6434
Email: 876david@gmail.com</div>
                    </div>
                    <div class="inv-info-card">
                        <div class="inv-info-label">Bill To</div>
                        <div class="inv-info-text"><strong>${esc(inv.customerName || 'Valued Client')}</strong>
${esc(inv.customerEmail || '—')}
${esc(inv.customerPhone || '—')}
${esc(inv.customerAddress || '—')}</div>
                    </div>
                </div>
            `;

            /* ── Line Items (4 columns like the PDF) ── */
            html += `
                <div class="inv-items-section">
                    <table class="items-table">
                        <thead><tr>
                            <th>Description</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                            <th>Amount</th>
                        </tr></thead>
                        <tbody>
                            ${inv.lineItems.map(item => `
                                <tr>
                                    <td class="item-desc">${esc(item.description)}</td>
                                    <td>${item.quantity}</td>
                                    <td>${fmtCurrency(item.unitPrice, inv.currency)}</td>
                                    <td>${fmtCurrency(item.amount, inv.currency)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            /* ── Payment Snapshot + Totals side-by-side ── */
            html += `
                <div class="inv-summary-row">
                    <div class="inv-payment-card">
                        <div class="inv-section-title">Payment Snapshot</div>
                        <div class="payment-row">
                            <span class="payment-label">Status</span>
                            <span class="payment-value ${statusClass}">${esc(inv.statusLabel || 'Awaiting Payment')}</span>
                        </div>
                        <div class="payment-row">
                            <span class="payment-label">Paid So Far</span>
                            <span class="payment-value">${fmtCurrency(inv.amountPaid, inv.currency)}</span>
                        </div>
                        <div class="payment-row">
                            <span class="payment-label">Paid Percentage</span>
                            <span class="payment-value">${fmtPercent(inv.amountPaidPercentage)}</span>
                        </div>
                        <div class="payment-row">
                            <span class="payment-label">Balance Due</span>
                            <span class="payment-value gold">${fmtCurrency(inv.balanceDue, inv.currency)}</span>
                        </div>
                        ${hasDeposit ? `
                            <div class="payment-row" style="margin-top:4px; padding-top:8px; border-top:1px solid var(--divider);">
                                <span class="payment-label">Deposit Required (${fmtPercent(inv.depositPercentage)})</span>
                                <span class="payment-value">${fmtCurrency(inv.depositAmount, inv.currency)}</span>
                            </div>
                            <div class="payment-row">
                                <span class="payment-label">Deposit Still Outstanding</span>
                                <span class="payment-value">${fmtCurrency(inv.depositOutstanding, inv.currency)}</span>
                            </div>
                        ` : ''}
                    </div>
                    <div class="inv-totals-card">
                        <div class="totals-row">
                            <span class="totals-label">Subtotal</span>
                            <span class="totals-value">${fmtCurrency(inv.subtotalAmount, inv.currency)}</span>
                        </div>
                        ${hasTax ? `
                            <div class="totals-row">
                                <span class="totals-label">Tax / Extra Fee</span>
                                <span class="totals-value">${fmtCurrency(inv.taxAmount, inv.currency)}</span>
                            </div>
                        ` : ''}
                        <hr class="totals-divider">
                        <div class="totals-row total-final">
                            <span class="totals-label">Project Total</span>
                            <span class="totals-value">${fmtCurrency(inv.totalAmount, inv.currency)}</span>
                        </div>
                    </div>
                </div>
            `;

            /* ── Notes ── */
            if (inv.notes) {
                html += `
                    <div class="inv-notes-section">
                        <div class="notes-title">Notes</div>
                        <div class="notes-text">${esc(inv.notes)}</div>
                    </div>
                `;
            }

            /* ── Exchange Policy ── */
            html += `
                <div class="inv-policy-banner">
                    <div class="policy-title">Exchange Policy</div>
                    <div class="policy-text">No refund, only exchange.</div>
                    <div class="policy-sub">Please keep this invoice for reference if an exchange is needed.</div>
                </div>
            `;

            /* ── Actions ── */
            const waText = encodeURIComponent(`Hello Windross, I have a question about invoice ${inv.invoiceNumber}.`);
            html += `
                <div class="inv-actions">
                    ${inv.pdfUrl ? `
                        <a href="${esc(inv.pdfUrl)}" target="_blank" rel="noopener" class="download-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Download Invoice PDF
                        </a>
                    ` : ''}
                    <div class="contact-link">
                        Need help? <a href="https://wa.me/18765986434?text=${waText}" target="_blank" rel="noopener">Contact Windross on WhatsApp</a>
                    </div>
                </div>
            `;

            el.innerHTML = html;
            document.title = `Invoice ${inv.invoiceNumber} — Windross Tailoring`;
        }

        /* ─── Load ─── */
        async function loadInvoice() {
            const params = new URLSearchParams(window.location.search);
            const invoiceNumber = params.get('inv');

            if (!invoiceNumber) {
                showError('No invoice specified', 'This link appears to be incomplete. Please check the link you received from Windross.');
                return;
            }

            try {
                const res = await fetch(`/api/invoice/${encodeURIComponent(invoiceNumber)}`);
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error || 'Invoice not found.');
                renderInvoice(data.invoice);
            } catch (err) {
                showError('Invoice not found', 'We couldn\'t load this invoice. It may have been removed or the link may be incorrect. Please contact Windross for help.');
            }
        }

        loadInvoice();
    </script>
</body>
</html>
